services:
  dashboard:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: https://dashboard.odbv.nl
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
    container_name: oranji-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    networks:
      - n8n_default

networks:
  n8n_default:
    external: true
